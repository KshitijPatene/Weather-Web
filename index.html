<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🌦️ My Weather App</h1>
    <p class="subtitle">Mini Project - Web Dev</p>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name...">
      <button onclick="getWeather()">Search</button>
    </div>

    <p id="errorMsg" class="error"></p>
    <p id="loading" class="loading">Loading...</p>

    <div id="weatherCard" class="weather-card">
      <h2 id="cityName"></h2>
      <p id="weatherIcon" class="icon"></p>
      <p id="temp" class="temp"></p>
      <p id="condition"></p>
      <div class="details">
        <p>💧 Humidity: <span id="humidity"></span>%</p>
        <p>💨 Wind: <span id="wind"></span> km/h</p>
      </div>
    </div>

    <p class="footer">made using Open-Meteo API (its free, no api key needed)</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
